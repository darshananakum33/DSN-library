<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DSN Library</title>
<style>
:root{--bg:#e4e1d0;--c:#f6f4ea;--t:#1b2433;--m:#4a5668;--p:#203850;--b:#c4c0aa;--hd:#203850;--hf:#e4e1d0}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--t)}
header{background:var(--hd);color:var(--hf);padding:10px 16px;position:relative}
.bar{max-width:1000px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;color:var(--hf);text-decoration:none}.brand b{font-size:20px;display:block;line-height:1.1}.brand small{font-size:12px;opacity:.9}
nav{display:flex;gap:6px}nav a{padding:8px 12px;border-radius:8px;color:var(--hf);text-decoration:none;border:1px solid transparent}nav a:hover{border-color:var(--hf)}
#mb{display:none;background:transparent;color:var(--hf);border:1px solid var(--hf);font-size:22px;line-height:1;padding:6px 12px;margin:0}
@media(max-width:760px){#mb{display:block}nav{display:none;position:absolute;left:0;right:0;top:100%;background:var(--hd);flex-direction:column;padding:8px 16px 14px;z-index:5;border-top:1px solid #3b5675}nav.open{display:flex}}
main{max-width:1000px;margin:0 auto;padding:16px}.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:14px;margin:10px 0}
input,select,textarea,button{font:inherit;padding:10px;border-radius:8px;border:1px solid var(--b);background:var(--c);color:var(--t);width:100%;margin:4px 0}
button{background:var(--p);color:var(--hf);border:0;cursor:pointer;width:auto}button.s{background:transparent;color:var(--p);border:1px solid var(--p);padding:6px 10px}
label{display:block;margin-top:8px;font-weight:600}.hp{position:absolute;left:-9999px}.ok{color:#127a3d}.no{color:#b3261e}.tag{font-size:14px;color:var(--m)}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1 1 140px}a{color:var(--p)}:focus-visible{outline:3px solid #b8860b;outline-offset:2px}
.hero{background:var(--hd);color:var(--hf);border-radius:14px;padding:28px 18px;text-align:center;margin-bottom:10px}.hero h2{margin:0 0 2px;font-size:28px}.hero p{margin:4px 0}
.cta{display:inline-block;margin:10px 4px 0;padding:10px 16px;border-radius:8px;background:var(--hf);color:var(--hd);text-decoration:none;font-weight:600}.cta.o{background:transparent;color:var(--hf);border:1px solid var(--hf)}
a.card{display:block;text-decoration:none;color:var(--t)}a.card:hover{border-color:var(--p)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px;margin:8px 0;border-bottom:1px solid var(--b)}.tb{background:transparent;color:var(--p);border:1px solid var(--p);white-space:nowrap}.tb.on{background:var(--p);color:var(--hf)}
</style></head><body>
<header><div class="bar"><a class="brand" href="#/" aria-label="DSN Library home"><svg width="44" height="44" viewBox="0 0 48 48" aria-hidden="true"><rect width="48" height="48" rx="10" fill="#e4e1d0"/><path d="M8 12h13c2 0 3 1 3 3v21c0-1.500-1-2.500-3-2.500H8z M40 12H27c-2 0-3 1-3 3v21c0-1.500 1-2.500 3-2.500h13z" fill="#203850"/><circle cx="24" cy="8" r="3" fill="#203850"/></svg><span><b id="nm">DSN Library</b><small>Digital Smart Network Library</small></span></a><button type="button" id="mb" aria-label="Open menu" aria-expanded="false" aria-controls="nv">&#9776;</button><nav id="nv"><a href="#/">Search</a><a href="#/apply">Apply for membership</a><a href="#/suggest">Suggest a book</a><a href="#/staff">Staff login</a></nav></div></header>
<main id="m"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
const sb=supabase.createClient(CFG.url,CFG.key),$=s=>document.querySelector(s),M=$("#m");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const STAFF=["super_admin","librarian","assistant_librarian","acquisition_staff"],CAT=["super_admin","librarian","assistant_librarian"];
let me=null;
async function loadMe(){const{data:{session}}=await sb.auth.getSession();me=null;if(session){const{data}=await sb.from("profiles").select("role,is_active").eq("id",session.user.id).maybeSingle();me=data}}
const avail=a=>!a||!a.total_copies?`<div class=no>No copies in library</div>`:a.available_copies>0?`<div class=ok>✔ ${a.available_copies} of ${a.total_copies} available</div>`:`<div class=no>All ${a.total_copies} copies are issued</div>`;
const LANG=["English","Gujarati","Hindi"];
const fld=([n,l,r,t,o])=>`<label for=${n}>${l}${r?" *":""}</label>`+(t==="select"?`<select id=${n}>${o.map(v=>`<option>${v}</option>`).join("")}</select>`:t==="textarea"?`<textarea id=${n} rows=3 maxlength=1000></textarea>`:`<input id=${n} type=${t||"text"}${r?" required":""}>`);
const vals=F=>{const o={};F.forEach(([n])=>{const v=$("#"+n).value.trim();if(v)o[n]=v});return o};

async function route(){const[,p,id]=(location.hash.slice(1)||"/").split("/");
 if(p==="book")return book(id);if(p==="apply"||p==="suggest")return form(p);if(p==="staff")return staff();return home()}
addEventListener("hashchange",route);

async function home(){
 M.innerHTML=`<div class=hero><h2>Welcome to DSN Library</h2><p>Digital Smart Network Library</p><p><i>Connecting Knowledge, Empowering Learning</i></p><a class=cta href="#/" onclick="document.getElementById('find').scrollIntoView({behavior:'smooth'});return false">Search the catalogue</a><a class="cta o" href="#/apply">Apply for membership</a></div><div class=row id=hs></div><div class=row><a class=card href="#/apply"><b>Become a member</b><div class=tag>Apply online in a minute</div></a><a class=card href="#/suggest"><b>Suggest a book</b><div class=tag>Tell us what to buy next</div></a><a class=card href="#/staff"><b>Staff area</b><div class=tag>Library staff sign in here</div></a></div><h2 id=find>Search the catalogue</h2><form class=card id=sf role=search><label for=q>Title, author, ISBN or subject</label><input id=q type=search><div class=row><div><label for=lg>Language</label><select id=lg><option value="">Any</option>${LANG.map(v=>`<option>${v}</option>`).join("")}</select></div><div><label for=av>Availability</label><select id=av><option value="">All</option><option value=1>Available now</option></select></div></div><button>Search</button></form><div id=res></div>`;
 $("#sf").onsubmit=e=>{e.preventDefault();search()};search();homeStats()}
async function homeStats(){const[a,t]=await Promise.all([sb.from("opac_availability").select("total_copies,available_copies"),sb.from("bib_records").select("*",{count:"exact",head:true})]);
 const h=$("#hs");if(!h)return;const tc=(a.data||[]).reduce((x,r)=>x+r.total_copies,0),av=(a.data||[]).reduce((x,r)=>x+r.available_copies,0);
 h.innerHTML=[["Titles",t.count??0],["Copies",tc],["Available now",av]].map(([l,v])=>`<div class=card style="text-align:center"><b style="font-size:26px">${v}</b><div class=tag>${l}</div></div>`).join("")}
async function search(){const q=$("#q").value.replace(/[,()%*"\\]/g," ").trim(),lg=$("#lg").value,av=$("#av").value,r=$("#res");r.textContent="Searching…";
 let x=sb.from("bib_records").select("id,title,author,publisher,publication_year,language,call_number").order("title").limit(50);
 if(q)x=x.or(["title","author","isbn","subject","keywords"].map(f=>`${f}.ilike.%${q}%`).join(","));
 if(lg)x=x.eq("language",lg);
 const{data,error}=await x;if(error)return r.textContent="Search failed. Please try again.";
 const{data:a}=await sb.from("opac_availability").select("bib_id,total_copies,available_copies").in("bib_id",data.map(b=>b.id));
 const A=Object.fromEntries((a||[]).map(v=>[v.bib_id,v])),list=data.filter(b=>!av||A[b.id]?.available_copies>0);
 r.innerHTML=list.length?list.map(b=>`<div class=card><a href="#/book/${esc(b.id)}"><b>${esc(b.title)}</b></a><div>${esc(b.author)}</div><div class=tag>${esc(b.publisher)} ${esc(b.publication_year)} · ${esc(b.language)} · ${esc(b.call_number)}</div>${avail(A[b.id])}</div>`).join(""):"<p>No results found.</p>"}

async function book(id){M.textContent="Loading…";
 const{data:b}=await sb.from("bib_records").select("*").eq("id",id).maybeSingle();if(!b)return M.innerHTML="<p>Book not found. <a href='#/'>Back</a></p>";
 const{data:a}=await sb.from("opac_availability").select("*").eq("bib_id",id).maybeSingle();
 const f=[["Author","author"],["Publisher","publisher"],["Year","publication_year"],["Edition","edition"],["ISBN","isbn"],["Language","language"],["Subject","subject"],["DDC","ddc_number"],["Colon class","colon_class"],["Call number","call_number"],["Pages","pages"]];
 M.innerHTML=`<p><a href="#/">← Back to search</a></p><div class=card><h2>${esc(b.title)}</h2>${avail(a)}${a?.locations?.length?`<div class=tag>Location: ${esc(a.locations.join(", "))}</div>`:""}<dl>${f.filter(([,k])=>b[k]).map(([l,k])=>`<dt class=tag>${l}</dt><dd>${esc(b[k])}</dd>`).join("")}</dl><p>${esc(b.description)}</p></div>`}

const FORMS={apply:{t:"Apply for membership",tb:"membership_applications",f:[["full_name","Full name",1],["email","Email",1,"email"],["phone","Phone",0,"tel"],["category","Category",1,"select",["student","faculty","staff","external"]],["institution_id","Institution ID / roll no.",0],["department","Department",0],["address","Address",0,"textarea"],["message","Message",0,"textarea"]]},
suggest:{t:"Suggest a book",tb:"book_suggestions",f:[["title","Book title",1],["author","Author",0],["isbn","ISBN",0],["publisher","Publisher",0],["reason","Why should we buy it?",0,"textarea"],["suggester_name","Your name",0],["suggester_email","Your email",0,"email"]]}};
function form(k){const F=FORMS[k];
 M.innerHTML=`<h2>${F.t}</h2><form class=card id=ff>${F.f.map(fld).join("")}<input class=hp id=hp tabindex=-1 autocomplete=off aria-hidden=true><button>Submit</button><p id=msg role=status></p></form>`;
 $("#ff").onsubmit=async e=>{e.preventDefault();const g=$("#msg");
  if($("#hp").value||Date.now()-(+localStorage.lastSub||0)<30000)return g.textContent="Please wait a moment and try again.";
  const{error}=await sb.from(F.tb).insert(vals(F.f));
  if(error)return g.textContent="Could not submit. Please check the details and try again.";
  localStorage.lastSub=Date.now();e.target.reset();g.textContent="Thank you! Your request was received."}}

const TF=[["title","Title",1],["author","Author"],["isbn","ISBN"],["publisher","Publisher"],["publication_year","Year",0,"number"],["edition","Edition"],["language","Language",0,"select",LANG],["subject","Subject"],["ddc_number","DDC number"],["colon_class","Colon class"],["call_number","Call number"]];
async function logout(){await sb.auth.signOut();staff()}
async function staff(){await loadMe();
 if(!me){M.innerHTML=`<h2>Staff login</h2><form class=card id=lf><label for=em>Email</label><input id=em type=email required><label for=pw>Password</label><input id=pw type=password required><button>Log in</button><p id=msg role=alert></p></form>`;
  $("#lf").onsubmit=async e=>{e.preventDefault();const{error}=await sb.auth.signInWithPassword({email:$("#em").value,password:$("#pw").value});error?$("#msg").textContent="Login failed. Check your email and password.":staff()};return}
 if(!me.is_active||!STAFF.includes(me.role)){M.innerHTML=`<p>Your account does not have staff access.</p><button id=lo>Log out</button>`;$("#lo").onclick=logout;return}
 const can=CAT.includes(me.role),acq=["super_admin","librarian","acquisition_staff"].includes(me.role),mgr=["super_admin","librarian"].includes(me.role);
 M.innerHTML=`<h2>Staff dashboard</h2><p class=tag>Role: ${esc(me.role)} <button class=s id=lo>Log out</button></p><div class=tabs>${[["over","Overview",1],["circ","Circulation",can],["mem","Members",can],["cat","Catalogue",1],["acq","Acquisition",acq],["req","Suggestions",1]].filter(t=>t[2]).map(([k,l])=>`<button type=button class="tb${k==="over"?" on":""}" data-t=${k}>${l}</button>`).join("")}</div><section class=tab id=t-over><div id=st class=row></div></section><section class=tab id=t-circ hidden>${can?`<h3>Circulation</h3><form class=card id=cf onsubmit="return false"><label for=cm>Member number (e.g. M-000001), needed for Issue</label><input id=cm><label for=ca>Accession number or barcode (e.g. ACC-000001)</label><input id=ca><button type=button data-a=issue_book>Issue</button> <button type=button data-a=return_book>Return</button> <button type=button data-a=renew_book>Renew</button><p id=cmsg role=status></p></form><h3>Currently issued</h3><div id=ln></div><h3>Reservations</h3><div id=rs></div><h3>Unpaid fines</h3><div id=fn></div>`:""}</section><section class=tab id=t-mem hidden>${can?`<h3>Members</h3><form class=card id=mf><div class=row><div><label for=mn>Full name *</label><input id=mn required></div><div><label for=me>Email</label><input id=me type=email></div><div><label for=mp>Phone</label><input id=mp type=tel></div><div><label for=mt>Member type</label><select id=mt></select></div></div><button>Add member</button><p id=mmsg role=status></p></form><div id=ml></div>`:""}${can?`<h3>Membership applications</h3><div id=ap></div>`:""}</section><section class=tab id=t-cat hidden>${can?`<h3>Add a title</h3><form class=card id=nb>${TF.map(fld).join("")}<button>Save title</button><p id=nmsg role=status></p></form>`:""}<h3>Catalogue and copies</h3><div id=cl></div></section><section class=tab id=t-acq hidden>${acq?`<h3>Acquisition</h3><form class=card id=sp><b>Add supplier</b><div class=row><div><label for=sn>Name *</label><input id=sn required></div><div><label for=se>Email</label><input id=se type=email></div><div><label for=sph>Phone</label><input id=sph type=tel></div></div><button>Add supplier</button><p id=spm role=status></p></form>${mgr?`<form class=card id=bd><b>Add budget</b><div class=row><div><label for=bn>Name *</label><input id=bn required></div><div><label for=by>Year</label><input id=by placeholder="2026-27"></div><div><label for=ba>Amount (Rs) *</label><input id=ba type=number min=0 step=0.01 required></div></div><button>Add budget</button><p id=bm role=status></p></form>`:""}<h4>Budgets</h4><div id=bs></div><form class=card id=od><b>New order (first item)</b><div class=row><div><label for=os>Supplier *</label><select id=os></select></div><div><label for=ob>Budget</label><select id=ob></select></div></div><div class=row><div><label for=ot>Title *</label><input id=ot required></div><div><label for=oa>Author</label><input id=oa></div><div><label for=oi>ISBN</label><input id=oi></div><div><label for=oq>Quantity *</label><input id=oq type=number min=1 value=1 required></div><div><label for=op>Unit price (Rs) *</label><input id=op type=number min=0 step=0.01 required></div></div><button>Create draft order</button><p id=om role=status></p></form><h4>Orders</h4><div id=ol></div>`:""}</section><section class=tab id=t-req hidden><h3>Book suggestions</h3><div id=su></div></section>`;
 $("#lo").onclick=logout;
 $(".tabs").onclick=e=>{const b=e.target.closest("button[data-t]");if(!b)return;document.querySelectorAll("section.tab").forEach(x=>x.hidden=x.id!=="t-"+b.dataset.t);document.querySelectorAll(".tb").forEach(x=>x.classList.toggle("on",x===b))};
 const cnt=async(t,f)=>{let x=sb.from(t).select("*",{count:"exact",head:true});if(f)x=f(x);return(await x).count??0};
 const[t,c,p]=await Promise.all([cnt("bib_records"),cnt("copies"),cnt("membership_applications",x=>x.eq("status","pending"))]);
 $("#st").innerHTML=[["Titles",t],["Copies",c],["Pending applications",p]].map(([l,v])=>`<div class=card><b style="font-size:24px">${v}</b><div class=tag>${l}</div></div>`).join("");
 if(can){$("#nb").onsubmit=async e=>{e.preventDefault();const o=vals(TF);if(o.publication_year)o.publication_year=+o.publication_year;
  const{error}=await sb.from("bib_records").insert(o);
  $("#nmsg").textContent=error?(error.code==="23505"?"This ISBN already exists.":"Could not save: "+error.message):"Saved.";if(!error){e.target.reset();staff()}};
  review("membership_applications","#ap","approved","rejected",1)}
 if(can)circ();if(acq)acquisition(mgr);catalogue(can);review("book_suggestions","#su","accepted","rejected",1)}

async function catalogue(can){
 const{data}=await sb.from("bib_records").select("id,title,author,call_number,copies(accession_number,status,location)").order("created_at",{ascending:false}).limit(30);
 $("#cl").innerHTML=(data||[]).map(b=>`<div class=card><b>${esc(b.title)}</b> <span class=tag>${esc(b.author)} · ${esc(b.call_number)}</span><div class=tag>${(b.copies||[]).map(c=>`${esc(c.accession_number)} (${esc(c.status)})`).join(", ")||"No copies yet"}</div>${can?`<button class=s data-b="${esc(b.id)}">+ Add copy</button> <button class=s data-r="${esc(b.id)}">Reserve</button>`:""}</div>`).join("")||"<p>No titles yet.</p>";
 $("#cl").onclick=async e=>{const rv=e.target.closest("button[data-r]");
  if(rv){const mn=prompt("Member number to reserve for (e.g. M-000001):");if(!mn)return;
   const{data,error}=await sb.rpc("reserve_title",{p_member_no:mn,p_bib:rv.dataset.r});alert(error?error.message:data);return lists()}
  const b=e.target.closest("button[data-b]");if(!b)return;const loc=prompt("Shelf location for the new copy (e.g. Main Hall - Rack A):");if(loc===null)return;
  const{data:br}=await sb.from("branches").select("id").eq("code","MAIN").maybeSingle();
  const{error}=await sb.from("copies").insert({bib_id:b.dataset.b,location:loc.trim()||null,branch_id:br?.id});
  if(error)alert("Could not add copy: "+error.message);catalogue(can)}}

async function review(tb,el,ok,no){
 const open=tb==="book_suggestions"?"new":"pending";
 const{data}=await sb.from(tb).select("*").order("created_at",{ascending:false}).limit(20);
 $(el).innerHTML=(data||[]).map(r=>`<div class=card><b>${esc(r.full_name||r.title)}</b> <span class=tag>${esc(r.status)}</span><div class=tag>${esc(r.email||r.author)} ${esc(r.category)} ${esc(r.phone)}</div><div>${esc(r.message||r.reason)}</div>${r.status===open?`<button class=s data-i="${esc(r.id)}" data-s="${ok}">${ok}</button> <button class=s data-i="${esc(r.id)}" data-s="${no}">${no}</button>`:tb==="membership_applications"&&r.status==="approved"?`<button class=s data-m="${esc(r.id)}">Create member</button>`:""}</div>`).join("")||"<p>None yet.</p>";
 $(el).onclick=async e=>{const m=e.target.closest("button[data-m]");
  if(m){const{data,error}=await sb.rpc("create_member_from_application",{p_app:m.dataset.m});alert(error?error.message:"Member created. Member number: "+data);return}
  const b=e.target.closest("button[data-i]");if(!b)return;
  const u=(await sb.auth.getUser()).data.user,o={status:b.dataset.s,reviewed_by:u.id};if(tb==="membership_applications")o.reviewed_at=new Date().toISOString();
  await sb.from(tb).update(o).eq("id",b.dataset.i);review(tb,el,ok,no)}}

async function circ(){
 $("#cf").onclick=async e=>{const b=e.target.closest("button[data-a]");if(!b)return;const a=$("#ca").value.trim(),m=$("#cm").value.trim(),g=$("#cmsg");
  if(!a||(b.dataset.a==="issue_book"&&!m))return g.textContent="Please fill in the required boxes.";
  g.textContent="Working…";
  const{data,error}=await sb.rpc(b.dataset.a,b.dataset.a==="issue_book"?{p_member_no:m,p_accession:a}:{p_accession:a});
  g.textContent=error?"✖ "+error.message:"✔ "+data;if(!error){$("#ca").value="";lists()}};
 $("#mf").onsubmit=async e=>{e.preventDefault();const o={full_name:$("#mn").value.trim(),member_type_id:$("#mt").value};
  if($("#me").value.trim())o.email=$("#me").value.trim();if($("#mp").value.trim())o.phone=$("#mp").value.trim();
  const{error}=await sb.from("members").insert(o);$("#mmsg").textContent=error?"Could not save: "+error.message:"Member added.";if(!error){e.target.reset();lists()}};
 $("#rs").onclick=async e=>{const b=e.target.closest("button[data-c]");if(!b||!confirm("Cancel this reservation?"))return;
  const{error}=await sb.rpc("cancel_reservation",{p_res:b.dataset.c});if(error)alert(error.message);lists()};
 await sb.rpc("expire_reservations");
 $("#fn").onclick=async e=>{const b=e.target.closest("button[data-f]");if(!b)return;
  const{data,error}=await sb.rpc("settle_fine",{p_fine:b.dataset.f,p_status:b.dataset.s});if(error)alert(error.message);lists()};
 const{data:T}=await sb.from("member_types").select("id,name").order("name");
 $("#mt").innerHTML=(T||[]).map(t=>`<option value="${esc(t.id)}">${esc(t.name)}</option>`).join("");lists()}
async function lists(){const today=new Date().toISOString().slice(0,10);
 const[L,F,Mm,R]=await Promise.all([
  sb.from("loans").select("due_date,renewals,members(member_no,full_name),copies(accession_number,bib_records(title))").is("returned_at",null).order("due_date").limit(50),
  sb.from("fines").select("id,amount,days_late,members(member_no,full_name)").eq("status","unpaid").limit(50),
  sb.from("members").select("member_no,full_name,status,expiry_date,member_types(name)").order("created_at",{ascending:false}).limit(30),
  sb.from("reservations").select("id,status,expires_at,created_at,members(member_no,full_name),bib_records(title),copies(accession_number)").in("status",["waiting","ready"]).order("created_at").limit(50)]);
 $("#rs").innerHTML=(R.data||[]).map(r=>`<div class=card><b>${esc(r.bib_records?.title)}</b> <span class=tag>${esc(r.status)}</span><div class=tag>${esc(r.members?.full_name)} (${esc(r.members?.member_no)})${r.status==="ready"?` · hold on ${esc(r.copies?.accession_number)} until ${esc(String(r.expires_at).slice(0,10))}`:""}</div><button class=s data-c="${esc(r.id)}">Cancel</button></div>`).join("")||"<p>No open reservations.</p>";
 $("#ln").innerHTML=(L.data||[]).map(l=>`<div class=card><b>${esc(l.copies?.bib_records?.title)}</b> <span class=tag>${esc(l.copies?.accession_number)}</span><div class=tag>${esc(l.members?.full_name)} (${esc(l.members?.member_no)}) · due ${esc(l.due_date)} · renewals ${l.renewals}</div>${l.due_date<today?`<div class=no>Overdue</div>`:""}</div>`).join("")||"<p>No books are currently issued.</p>";
 $("#fn").innerHTML=(F.data||[]).map(f=>`<div class=card>Rs ${esc(f.amount)} · ${esc(f.members?.full_name)} (${esc(f.members?.member_no)}) · ${f.days_late} days late<br><button class=s data-f="${esc(f.id)}" data-s=paid>Mark paid</button> <button class=s data-f="${esc(f.id)}" data-s=waived>Waive</button></div>`).join("")||"<p>No unpaid fines.</p>";
 $("#ml").innerHTML=(Mm.data||[]).map(m=>`<div class=card><b>${esc(m.full_name)}</b> <span class=tag>${esc(m.member_no)} · ${esc(m.member_types?.name)} · ${esc(m.status)} · expires ${esc(m.expiry_date)}</span></div>`).join("")||"<p>No members yet.</p>"}

async function acquisition(mgr){
 const val=id=>$("#"+id).value.trim(),say=(id,error,ok)=>$("#"+id).textContent=error?"Could not save: "+error.message:ok;
 $("#sp").onsubmit=async e=>{e.preventDefault();const o={name:val("sn")};if(val("se"))o.email=val("se");if(val("sph"))o.phone=val("sph");
  const{error}=await sb.from("suppliers").insert(o);say("spm",error,"Supplier added.");if(!error){e.target.reset();aq()}};
 if(mgr)$("#bd").onsubmit=async e=>{e.preventDefault();const o={name:val("bn"),amount:+val("ba")};if(val("by"))o.fiscal_year=val("by");
  const{error}=await sb.from("budgets").insert(o);say("bm",error,"Budget added.");if(!error){e.target.reset();aq()}};
 $("#od").onsubmit=async e=>{e.preventDefault();const o={supplier_id:$("#os").value};if($("#ob").value)o.budget_id=$("#ob").value;
  const{data:od,error}=await sb.from("orders").insert(o).select("id").single();if(error)return say("om",error);
  const it={order_id:od.id,title:val("ot"),quantity:+val("oq"),unit_price:+val("op")};if(val("oa"))it.author=val("oa");if(val("oi"))it.isbn=val("oi");
  const r=await sb.from("order_items").insert(it);say("om",r.error,"Draft order created.");e.target.reset();aq()};
 $("#ol").onclick=async e=>{const b=e.target.closest("button[data-k]");if(!b)return;const k=b.dataset.k,i=b.dataset.i;let r;
  if(k==="add"){const t=prompt("Title:");if(!t)return;const q=+prompt("Quantity:","1"),p=+prompt("Unit price (Rs):");if(!q||isNaN(p))return alert("Quantity and price are needed");r=await sb.from("order_items").insert({order_id:i,title:t.trim(),quantity:q,unit_price:p})}
  else if(k==="place")r=await sb.rpc("place_order",{p_order:i});
  else if(k==="cancel"){if(!confirm("Cancel this order?"))return;r=await sb.rpc("cancel_order",{p_order:i})}
  else if(k==="recv"){const q=+prompt("How many copies arrived?","1");if(!q)return;r=await sb.rpc("receive_item",{p_item:i,p_qty:q})}
  else if(k==="inv"){const n=prompt("Invoice number:");if(!n)return;const a=+prompt("Invoice amount (Rs):");if(!a)return;r=await sb.rpc("record_invoice",{p_order:i,p_no:n.trim(),p_amount:a})}
  else if(k==="pay")r=await sb.rpc("pay_invoice",{p_inv:i});
  if(r.error)alert(r.error.message);else if(typeof r.data==="string")alert(r.data);aq()};
 aq()}
async function aq(){
 const[S,B,O]=await Promise.all([sb.from("suppliers").select("id,name").eq("is_active",true).order("name"),sb.from("budget_summary").select("*").order("name"),
  sb.from("orders").select("id,order_no,status,suppliers(name),budgets(name),order_items(id,title,quantity,unit_price,received_qty),invoices(id,invoice_no,amount,status)").order("created_at",{ascending:false}).limit(20)]);
 const opt=a=>(a||[]).map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join("");
 $("#os").innerHTML=opt(S.data);$("#ob").innerHTML=`<option value="">No budget</option>`+opt(B.data);
 $("#bs").innerHTML=(B.data||[]).map(b=>`<div class=card><b>${esc(b.name)}</b> <span class=tag>${esc(b.fiscal_year)}</span><div class=tag>Budget Rs ${b.amount} · ordered Rs ${b.ordered} · remaining Rs ${(b.amount-b.ordered).toFixed(2)} · invoiced Rs ${b.invoiced}</div></div>`).join("")||"<p>No budgets yet.</p>";
 const btn=(k,i,t)=>`<button class=s data-k=${k} data-i="${esc(i)}">${t}</button> `;
 $("#ol").innerHTML=(O.data||[]).map(o=>{const tot=o.order_items.reduce((s,i)=>s+i.quantity*i.unit_price,0),got=o.order_items.some(i=>i.received_qty>0),st=o.status;
  return `<div class=card><b>${esc(o.order_no)}</b> <span class=tag>${esc(st)} · ${esc(o.suppliers?.name)} · ${esc(o.budgets?.name||"no budget")} · Rs ${tot.toFixed(2)}</span>`
  +o.order_items.map(i=>`<div class=tag>${esc(i.title)} × ${i.quantity} @ Rs ${i.unit_price} · received ${i.received_qty} `+(st==="placed"&&i.received_qty<i.quantity?btn("recv",i.id,"Receive"):"")+`</div>`).join("")
  +o.invoices.map(v=>`<div class=tag>Invoice ${esc(v.invoice_no)} Rs ${v.amount} · ${esc(v.status)} `+(v.status==="unpaid"?btn("pay",v.id,"Mark paid"):"")+`</div>`).join("")
  +(st==="draft"?btn("add",o.id,"Add item")+btn("place",o.id,"Place order"):"")+(st==="placed"||st==="received"?btn("inv",o.id,"Record invoice"):"")+(st==="draft"||(st==="placed"&&!got)?btn("cancel",o.id,"Cancel"):"")+`</div>`}).join("")||"<p>No orders yet.</p>"}

sb.from("settings").select("key,value").then(({data})=>{(data||[]).forEach(r=>{if(r.key==="library_name")$("#nm").textContent=r.value})});
const mb=$("#mb"),nv=$("#nv");mb.onclick=()=>{const o=nv.classList.toggle("open");mb.setAttribute("aria-expanded",o)};nv.onclick=e=>{if(e.target.closest("a")){nv.classList.remove("open");mb.setAttribute("aria-expanded","false")}};
route();
</script></body></html>

<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DSN Library</title>
<style>
:root{--bg:#e4e1d0;--c:#f6f4ea;--t:#1b2433;--m:#4a5668;--p:#203850;--b:#c4c0aa;--hd:#203850;--hf:#e4e1d0}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--t)}
header{background:var(--hd);color:var(--hf);padding:10px 16px;position:relative}
.bar{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;color:var(--hf);text-decoration:none}.brand b{font-size:20px;display:block;line-height:1.1}.brand small{font-size:12px;opacity:.9}
nav{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}nav a{padding:8px 12px;border-radius:8px;color:var(--hf);text-decoration:none;border:1px solid transparent}nav a:hover{border-color:var(--hf)}
#lg{width:auto;background:var(--hd);color:var(--hf);border:1px solid var(--hf);padding:6px 8px;margin:0 0 0 6px}
#mb{display:none;background:transparent;color:var(--hf);border:1px solid var(--hf);font-size:22px;line-height:1;padding:6px 12px;margin:0}
@media(max-width:760px){#mb{display:block}nav{display:none;position:absolute;left:0;right:0;top:100%;background:var(--hd);flex-direction:column;padding:8px 16px 14px;z-index:5;border-top:1px solid #3b5675}nav.open{display:flex}}
main{max-width:1000px;margin:0 auto;padding:16px}.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:14px;margin:10px 0}
input,select,textarea,button{font:inherit;padding:10px;border-radius:8px;border:1px solid var(--b);background:var(--c);color:var(--t);width:100%;margin:4px 0}
button{background:var(--p);color:var(--hf);border:0;cursor:pointer;width:auto}button.s{background:transparent;color:var(--p);border:1px solid var(--p);padding:6px 10px}
label{display:block;margin-top:8px;font-weight:600}.hp{position:absolute;left:-9999px}.ok{color:#127a3d}.no{color:#b3261e}.tag{font-size:14px;color:var(--m)}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1 1 140px}a{color:var(--p)}:focus-visible{outline:3px solid #b8860b;outline-offset:2px}
.hero{background:var(--hd);color:var(--hf);border-radius:14px;padding:28px 18px;text-align:center;margin-bottom:10px}.hero h2{margin:0 0 2px;font-size:28px}.hero p{margin:4px 0}
.cta{display:inline-block;margin:10px 4px 0;padding:10px 16px;border-radius:8px;background:var(--hf);color:var(--hd);text-decoration:none;font-weight:600}.cta.o{background:transparent;color:var(--hf);border:1px solid var(--hf)}
a.card{display:block;text-decoration:none;color:var(--t)}a.card:hover{border-color:var(--p)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px;margin:8px 0;border-bottom:1px solid var(--b)}.tb{background:transparent;color:var(--p);border:1px solid var(--p);white-space:nowrap}.tb.on{background:var(--p);color:var(--hf)}
#cbBtn{position:fixed;right:16px;bottom:16px;width:56px;height:56px;border-radius:50%;font-size:26px;padding:0;z-index:20;box-shadow:0 2px 8px #0004}
#cb{position:fixed;right:12px;bottom:84px;width:min(360px,94vw);height:min(70vh,520px);background:var(--c);border:1px solid var(--b);border-radius:14px;display:flex;flex-direction:column;z-index:20;box-shadow:0 4px 18px #0005;overflow:hidden}#cb[hidden]{display:none}
.cbh{background:var(--hd);color:var(--hf);padding:10px 12px;display:flex;justify-content:space-between;align-items:center}.cbh button{background:transparent;color:var(--hf);border:1px solid var(--hf);padding:2px 8px;margin:0 0 0 4px}
#cbM{flex:1;overflow-y:auto;padding:10px}#cbM div.me,#cbM div.bot{margin:6px 0;padding:8px 10px;border-radius:10px;max-width:92%}#cbM .me{background:var(--p);color:var(--hf);margin-left:auto}#cbM .bot{background:#fff;border:1px solid var(--b)}
#cbC{display:flex;gap:6px;flex-wrap:wrap;padding:0 10px 6px}#cbC button{background:transparent;color:var(--p);border:1px solid var(--p);padding:4px 10px;margin:0;font-size:14px}
#cbF{display:flex;gap:6px;padding:8px;border-top:1px solid var(--b)}#cbF input,#cbF button{margin:0}
.pl{white-space:pre-line;margin:2px 0 8px}.cimg{width:100%;max-height:220px;object-fit:cover;border-radius:8px;margin-bottom:8px}
.bar{flex-wrap:wrap}.brand{order:1}#lg{order:2;margin-left:auto}#mb{order:3}
.brand b{font-size:22px;letter-spacing:.3px}.brand small{font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase}
@media(min-width:761px){nav{order:4;width:100%;justify-content:flex-start;margin-top:8px;padding-top:8px;border-top:1px solid #3b5675}}
table.reg{border-collapse:collapse;width:100%;font-size:13px}table.reg th,table.reg td{border:1px solid var(--b);padding:4px 6px;text-align:left;vertical-align:top}table.reg th{background:var(--c)}
@media print{body *{visibility:hidden}#regp,#regp *{visibility:visible}#regp{position:absolute;left:0;top:0;width:100%}}
</style></head><body>
<header><div class="bar"><a class="brand" href="#/" aria-label="DSN Library home"><svg width="48" height="48" viewBox="0 0 64 64" role="img" aria-label="DSN Library emblem"><circle cx="32" cy="32" r="30" fill="#e4e1d0" stroke="#c9a227" stroke-width="2.5"/><path d="M22 14 L32 9 L42 14 M22 14 L32 24 M32 9 L32 24 M42 14 L32 24" fill="none" stroke="#c9a227" stroke-width="1.3"/><circle cx="22" cy="14" r="2.6" fill="#c9a227"/><circle cx="32" cy="9" r="2.6" fill="#c9a227"/><circle cx="42" cy="14" r="2.6" fill="#c9a227"/><path d="M13 41 C20 36.500 27 36.500 32 41 C37 36.500 44 36.500 51 41 L51 26 C44 21.500 37 21.500 32 26 C27 21.500 20 21.500 13 26 Z" fill="#203850"/><path d="M32 26 L32 41" stroke="#e4e1d0" stroke-width="1.6"/><text x="32" y="54" text-anchor="middle" font-family="Georgia,serif" font-weight="700" font-size="10" letter-spacing="1" fill="#203850">DSN</text></svg><span><b id="nm">DSN Library</b><small>Digital Smart Network Library</small></span></a><button type="button" id="mb" aria-label="Open menu" aria-expanded="false" aria-controls="nv">&#9776;</button><nav id="nv"><a href="#/">Search</a><a href="#/apply">Apply for membership</a><a href="#/suggest">Suggest a book</a><a href="#/eresources">E-resources</a><a href="#/feedback">Feedback</a><a href="#/account">My account</a><a href="#/staff">Staff login</a></nav><select id="lg" aria-label="Language"><option value="en">English</option><option value="gu">ગુજરાતી</option><option value="hi">हिन्दी</option></select></div></header>
<main id="m"></main>
<button type="button" id="cbBtn" aria-label="Open the library assistant" aria-expanded="false">&#128172;</button>
<div id="cb" hidden role="dialog" aria-label="DSN Library Assistant"><div class="cbh"><b id="cbT"></b><span><button type="button" data-l="en">EN</button><button type="button" data-l="gu">ગુ</button><button type="button" id="cbX" aria-label="Close chat">&#10005;</button></span></div><div id="cbM" aria-live="polite"></div><div id="cbC"></div><form id="cbF"><input id="cbI" autocomplete="off" aria-label="Your message"><button id="cbS">Send</button></form></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js"></script>
<script src="config.js"></script>
<script>
const sb=supabase.createClient(CFG.url,CFG.key),$=s=>document.querySelector(s),M=$("#m");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const STAFF=["super_admin","librarian","assistant_librarian","acquisition_staff"],CAT=["super_admin","librarian","assistant_librarian"];
let me=null;
async function loadMe(){const{data:{session}}=await sb.auth.getSession();me=null;if(session){const{data}=await sb.from("profiles").select("role,is_active").eq("id",session.user.id).maybeSingle();me=data}}
const avail=a=>!a||!a.total_copies?`<div class=no>No copies in library</div>`:a.available_copies>0?`<div class=ok>✔ ${a.available_copies} of ${a.total_copies} available</div>`:`<div class=no>All ${a.total_copies} copies are issued</div>`;
const LANG=["English","Gujarati","Hindi"];
const fld=([n,l,r,t,o])=>`<label for=${n}>${l}${r?" *":""}</label>`+(t==="select"?`<select id=${n}>${o.map(v=>`<option>${v}</option>`).join("")}</select>`:t==="textarea"?`<textarea id=${n} rows=3 maxlength=1000></textarea>`:`<input id=${n} type=${t||"text"}${r?" required":""}>`);
const vals=F=>{const o={};F.forEach(([n])=>{const v=$("#"+n).value.trim();if(v)o[n]=v});return o};

async function route(){const[,p,id]=(location.hash.slice(1)||"/").split("/");
 if(p==="book")return book(id);if(p==="eresources")return eres();if(p==="culture")return culture();if(p==="account")return account();if(p==="journals")return journals();if(p==="apply"||p==="suggest"||p==="feedback")return form(p);if(p==="staff")return staff();return home()}
addEventListener("hashchange",route);

async function home(){
 M.innerHTML=`<div class=hero><h2>Welcome to DSN Library</h2><p>Digital Smart Network Library</p><p><i>Connecting Knowledge, Empowering Learning</i></p><a class=cta href="#/" onclick="document.getElementById('find').scrollIntoView({behavior:'smooth'});return false">Search the catalogue</a><a class="cta o" href="#/apply">Apply for membership</a></div><div class=row id=hs></div><div class=row><a class=card href="#/apply"><b>Become a member</b><div class=tag>Apply online in a minute</div></a><a class=card href="#/suggest"><b>Suggest a book</b><div class=tag>Tell us what to buy next</div></a><a class=card href="#/culture"><b>Festivals and inspiring people</b><div class=tag>Celebrations and stories from India and the world</div></a><a class=card href="#/journals"><b>Journals and magazines</b><div class=tag>See what we subscribe to</div></a><a class=card href="#/staff"><b>Staff area</b><div class=tag>Library staff sign in here</div></a></div><h2 id=find>Search the catalogue</h2><form class=card id=sf role=search><label for=q>Title, author, ISBN or subject</label><input id=q type=search><div class=row><div><label for=slg>Language</label><select id=slg><option value="">Any</option>${LANG.map(v=>`<option>${v}</option>`).join("")}</select></div><div><label for=av>Availability</label><select id=av><option value="">All</option><option value=1>Available now</option></select></div></div><button>Search</button></form><div id=res></div>`;
 $("#sf").onsubmit=e=>{e.preventDefault();search()};search();homeStats()}
async function homeStats(){const[a,t]=await Promise.all([sb.from("opac_availability").select("total_copies,available_copies"),sb.from("bib_records").select("*",{count:"exact",head:true})]);
 const h=$("#hs");if(!h)return;const tc=(a.data||[]).reduce((x,r)=>x+r.total_copies,0),av=(a.data||[]).reduce((x,r)=>x+r.available_copies,0);
 h.innerHTML=[["Titles",t.count??0],["Copies",tc],["Available now",av]].map(([l,v])=>`<div class=card style="text-align:center"><b style="font-size:26px">${v}</b><div class=tag>${l}</div></div>`).join("")}
async function search(){const q=$("#q").value.replace(/[,()%*"\\]/g," ").trim(),lg=$("#slg").value,av=$("#av").value,r=$("#res");r.textContent="Searching…";
 let x=sb.from("bib_records").select("id,title,author,publisher,publication_year,language,call_number").order("title").limit(50);
 if(q)x=x.or(["title","author","isbn","subject","keywords"].map(f=>`${f}.ilike.%${q}%`).join(","));
 if(lg)x=x.eq("language",lg);
 const{data,error}=await x;if(error)return r.textContent="Search failed. Please try again.";
 const{data:a}=await sb.from("opac_availability").select("bib_id,total_copies,available_copies").in("bib_id",data.map(b=>b.id));
 const A=Object.fromEntries((a||[]).map(v=>[v.bib_id,v])),list=data.filter(b=>!av||A[b.id]?.available_copies>0);
 r.innerHTML=list.length?list.map(b=>`<div class=card><a href="#/book/${esc(b.id)}"><b>${esc(b.title)}</b></a><div>${esc(b.author)}</div><div class=tag>${esc(b.publisher)} ${esc(b.publication_year)} · ${esc(b.language)} · ${esc(b.call_number)}</div>${avail(A[b.id])}</div>`).join(""):"<p>No results found.</p>"}

async function book(id){M.textContent="Loading…";
 const{data:b}=await sb.from("bib_records").select("*").eq("id",id).maybeSingle();if(!b)return M.innerHTML="<p>Book not found. <a href='#/'>Back</a></p>";
 const{data:a}=await sb.from("opac_availability").select("*").eq("bib_id",id).maybeSingle();
 const f=[["Author","author"],["Publisher","publisher"],["Year","publication_year"],["Edition","edition"],["ISBN","isbn"],["Language","language"],["Subject","subject"],["DDC","ddc_number"],["Colon class","colon_class"],["Call number","call_number"],["Pages","pages"]];
 M.innerHTML=`<p><a href="#/">← Back to search</a></p><div class=card><h2>${esc(b.title)}</h2>${avail(a)}${a?.locations?.length?`<div class=tag>Location: ${esc(a.locations.join(", "))}</div>`:""}<dl>${f.filter(([,k])=>b[k]).map(([l,k])=>`<dt class=tag>${l}</dt><dd>${esc(b[k])}</dd>`).join("")}</dl><p>${esc(b.description)}</p></div>`}

const FORMS={apply:{t:"Apply for membership",tb:"membership_applications",f:[["full_name","Full name",1],["email","Email",1,"email"],["phone","Phone",0,"tel"],["category","Category",1,"select",["student","faculty","staff","external"]],["institution_id","Institution ID / roll no.",0],["department","Department",0],["dob","Date of birth",0,"date"],["blood_group","Blood group",0,"select",["","A+","A-","B+","B-","AB+","AB-","O+","O-"]],["address","Address",0,"textarea"],["message","Message",0,"textarea"]]},
feedback:{t:"Share your feedback",tb:"feedback",f:[["rating","How satisfied are you? (5 = excellent, 1 = poor)",1,"select",["5","4","3","2","1"]],["category","Your feedback is about",1,"select",["service","collection","facilities","website","other"]],["comment","Comments (optional, please do not include personal details)",0,"textarea"]]},
suggest:{t:"Suggest a book",tb:"book_suggestions",f:[["title","Book title",1],["author","Author",0],["isbn","ISBN",0],["publisher","Publisher",0],["reason","Why should we buy it?",0,"textarea"],["suggester_name","Your name",0],["suggester_email","Your email",0,"email"]]}};
function form(k){const F=FORMS[k];
 M.innerHTML=`<h2>${F.t}</h2><form class=card id=ff>${F.f.map(fld).join("")}${k==="apply"?`<label for=ph>Passport photo (JPG) *</label><input id=ph type=file accept="image/jpeg,image/png" required><label for=sg>Your signature (JPG or PDF, max 15 KB) *</label><input id=sg type=file accept="image/jpeg,application/pdf" required>`:""}<input class=hp id=hp tabindex=-1 autocomplete=off aria-hidden=true><button>Submit</button><p id=msg role=status></p></form>`;
 $("#ff").onsubmit=async e=>{e.preventDefault();const g=$("#msg");
  if($("#hp").value||Date.now()-(+localStorage.lastSub||0)<30000)return g.textContent="Please wait a moment and try again.";
  let o=vals(F.f);if(k==="apply"){try{g.textContent="Uploading…";o={...o,...await applyFiles()}}catch(er){return g.textContent=er.message}}
  const{error}=await sb.from(F.tb).insert(o);
  if(error)return g.textContent="Could not submit. Please check the details and try again.";
  localStorage.lastSub=Date.now();e.target.reset();g.textContent="Thank you! Your request was received."}}

const EV=[["ev_title","Event title",1],["ev_event_date","Date",1,"date"],["ev_attendance","Attendance (number of people)",1,"number"],["ev_description","Notes",0,"textarea"]];
const IL=[["il_direction","Direction",1,"select",["borrowed","lent"]],["il_partner_library","Partner library",1],["il_title","Book or article title",1],["il_requester","Requested by",0],["il_request_date","Request date",1,"date"],["il_notes","Notes",0,"textarea"]];
const ER=[["er_title","Resource title",1],["er_url","Link (must start with https://)",1,"url"],["er_description","Description",0,"textarea"]];
const vp=(F,pre)=>{const o={};F.forEach(([n])=>{const v=$("#"+n).value.trim();if(v)o[n.slice(pre.length)]=v});return o};
const SE=[["se_title","Journal or serial title",1],["se_issn","ISSN (like 1234-5679)",0],["se_publisher","Publisher",0],["se_frequency","Frequency",1,"select",["monthly","weekly","fortnightly","bimonthly","quarterly","half_yearly","yearly"]],["se_language","Language",0,"select",LANG],["se_subject","Subject",0]];
const SS=[["ss_start_date","Start date",1,"date"],["ss_end_date","End date",1,"date"],["ss_amount","Amount (Rs)",1,"number"],["ss_invoice_no","Invoice or reference no.",0]];
const SI=[["si_volume","Volume",0],["si_issue_no","Issue number",1],["si_issue_date","Cover date",1,"date"],["si_status","Status",1,"select",["received","expected","missing","claimed"]]];
const FQ=[["fq_question_en","Question (English)",1],["fq_answer_en","Answer (English)",1,"textarea"],["fq_answer_gu","Answer (Gujarati)",0,"textarea"],["fq_keywords","Keywords (comma separated)",1]];
const CU=[["cu_kind","Type",1,"select",["festival","person"]],["cu_title","Festival or person name",1],["cu_country","Country (default India)",0],["cu_region","State or region",0],["cu_date_start","Festival date (start)",0,"date"],["cu_date_end","Festival date (end, if more than one day)",0,"date"],["cu_why","Why it is celebrated (for a person: what they are known for)",0,"textarea"],["cu_importance","Why it is important (for a person: life and story)",0,"textarea"],["cu_traditions","What people do on this day (for a person: their lasting influence)",0,"textarea"],["cu_image_url","Photo link (must start with https://)",0,"url"],["cu_image_credit","Photo credit and licence (required if there is a photo)",0],["cu_source_name","Source name (for example UNESCO or Britannica)",0],["cu_source_url","Source link (required to publish)",0,"url"]];
const BR=[["br_name","Branch name",1],["br_code","Short code (e.g. SCI)",1],["br_address","Address",0]];
const ROLES=["super_admin","librarian","assistant_librarian","acquisition_staff","member"];
const TF=[["title","Title",1],["author","Author"],["isbn","ISBN"],["publisher","Publisher"],["publication_year","Year",0,"number"],["edition","Edition"],["language","Language",0,"select",LANG],["material_type","Material type",0,"select",["print","non_print","e_resource"]],["subject","Subject"],["ddc_number","DDC number"],["colon_class","Colon class"],["call_number","Call number"]];
async function logout(){await sb.auth.signOut();staff()}
async function staff(){EDIT=null;await loadMe();
 if(!me){M.innerHTML=`<h2>Staff login</h2><form class=card id=lf><label for=em>Email</label><input id=em type=email required><label for=pw>Password</label><input id=pw type=password required><button>Log in</button><p id=msg role=alert></p></form>`;
  $("#lf").onsubmit=async e=>{e.preventDefault();const{error}=await sb.auth.signInWithPassword({email:$("#em").value,password:$("#pw").value});error?$("#msg").textContent="Login failed. Check your email and password.":staff()};return}
 if(!me.is_active||!STAFF.includes(me.role)){M.innerHTML=`<p>Your account does not have staff access.</p><button id=lo>Log out</button>`;$("#lo").onclick=logout;return}
 const can=CAT.includes(me.role),acq=["super_admin","librarian","acquisition_staff"].includes(me.role),mgr=["super_admin","librarian"].includes(me.role);
 M.innerHTML=`<h2>Staff dashboard</h2><p class=tag>Role: ${esc(me.role)} <button class=s id=lo>Log out</button></p><div class=tabs>${[["over","Overview",1],["circ","Circulation",can],["mem","Members",can],["cat","Catalogue",1],["acq","Acquisition",acq],["req","Suggestions",1],["rem","Reminders",can],["reg","Registers",can],["stk","Stock check",can],["ser","Serials",1],["act","Events and ILL",can],["rep","Reports",mgr],["cul","Festivals and people",can],["adm","Admin",mgr]].filter(t=>t[2]).map(([k,l])=>`<button type=button class="tb${k==="over"?" on":""}" data-t=${k}>${l}</button>`).join("")}</div><section class=tab id=t-over><div id=st class=row></div></section><section class=tab id=t-circ hidden>${can?`<h3>Circulation</h3><form class=card id=cf onsubmit="return false"><label for=cm>Member number (e.g. M-000001), needed for Issue</label><input id=cm><label for=ca>Accession number or barcode (e.g. ACC-000001)</label><input id=ca><button type=button data-a=issue_book>Issue</button> <button type=button data-a=return_book>Return</button> <button type=button data-a=renew_book>Renew</button><p id=cmsg role=status></p></form><h3>Currently issued</h3><div id=ln></div><h3>Reservations</h3><div id=rs></div><h3>Unpaid fines</h3><div id=fn></div>`:""}</section><section class=tab id=t-mem hidden>${can?`<h3>Members</h3><form class=card id=mf><div class=row><div><label for=mn>Full name *</label><input id=mn required></div><div><label for=me>Email</label><input id=me type=email></div><div><label for=mp>Phone</label><input id=mp type=tel></div><div><label for=mt>Member type</label><select id=mt></select></div></div><button>Add member</button><p id=mmsg role=status></p></form><div id=ml></div>`:""}${can?`<h3>Membership applications</h3><div id=ap></div>`:""}</section><section class=tab id=t-cat hidden>${can?`<h3>Add a title</h3><form class=card id=nb>${TF.map(fld).join("")}<button>Save title</button><p id=nmsg role=status></p></form>`:""}<h3>Catalogue and copies</h3><input id=cq type  $("#cbC").innerHTML=T.chips.map(([x,k])=>`<button type=button data-k=${k}>${esc(x)}</button>`).join("");cbAdd("bot",esc(T.hi))}
async function cbFaq(){if(!cbFaqCache)cbFaqCache=(await sb.from("faq").select("*").eq("is_active",true)).data||[];return cbFaqCache}
async function cbSearch(q){q=q.replace(/[,()%*"\\]/g," ").trim();if(!q)return[];
 const run=async t=>(await sb.from("bib_records").select("id,title,author").or(["title","author","subject","isbn"].map(f=>`${f}.ilike.%${t}%`).join(",")).limit(5)).data||[];
 let r=await run(q);if(!r.length){const w=q.split(/\s+/).filter(x=>x.length>2).sort((a,b)=>b.length-a.length)[0];if(w&&w!==q)r=await run(w)}
 if(!r.length)return[];const{data:a}=await sb.from("opac_availability").select("bib_id,total_copies,available_copies").in("bib_id",r.map(x=>x.id));
 const A=Object.fromEntries((a||[]).map(v=>[v.bib_id,v]));return r.map(b=>({...b,a:A[b.id]}))}
async function cbAsk(txt){const L=/[\u0A80-\u0AFF]/.test(txt)?"gu":CB.lang,T=CBT[L],low=txt.toLowerCase().trim();cbAdd("me",esc(txt));
 const pre=["find ","search ","શોધો ","શોધ "].find(x=>low.startsWith(x));
 if(!pre){let best=null,bs=0;for(const x of await cbFaq()){const sc=(x.keywords||"").toLowerCase().split(",").map(k=>k.trim()).filter(Boolean).filter(k=>low.includes(k)).length;if(sc>bs){bs=sc;best=x}}
  if(best)return cbAdd("bot",esc(L==="gu"&&best.answer_gu?best.answer_gu:best.answer_en))}
 const r=await cbSearch(pre?txt.slice(pre.length):txt);
 if(!r.length)return cbAdd("bot",esc(T.none));
 cbAdd("bot",r.map(b=>`<div><a href="#/book/${esc(b.id)}">${esc(b.title)}</a> ${esc(b.author||"")}<br><small>${esc(T.av(b.a?.available_copies||0,b.a?.total_copies||0))}</small></div>`).join(""))}

let SKID=null;
async function stock(mgr){const el=$("#sk");if(!el)return;
 const{data:L}=await sb.from("stock_checks").select("id,name,location_filter,status,closed_at,result").order("started_at",{ascending:false}).limit(10);
 const open=(L||[]).find(x=>x.status==="open");SKID=open?open.id:null;let h="";
 if(open){const{count}=await sb.from("stock_check_scans").select("*",{count:"exact",head:true}).eq("check_id",open.id);
  h+=`<div class=card><b>${esc(open.name)}</b> <span class=tag>open${open.location_filter?" · locations starting with "+esc(open.location_filter):""} · scanned so far: <span id=skn>${count??0}</span></span><form id=skf><label for=skc>Accession number or barcode</label><input id=skc autocomplete=off><button>Record</button></form><p id=skm role=status></p><button class=s id=skx type=button>Close this stock check</button></div>`}
 else h+=`<form class=card id=sks><b>Start a stock check</b><label for=skname>Name *</label><input id=skname required placeholder="Shelf check Nov 2026"><label for=skloc>Only check locations starting with (optional)</label><input id=skloc placeholder="Main Hall"><button>Start</button><p id=sksm role=status></p></form>`;
 h+="<h4>Finished checks</h4>"+((L||[]).filter(x=>x.status==="closed").map(x=>{const r=x.result||{};return `<div class=card><b>${esc(x.name)}</b> <span class=tag>${esc(String(x.closed_at).slice(0,10))} · expected ${r.expected} · found ${r.found} · missing ${(r.missing||[]).length} · unknown codes ${(r.unknown||[]).length}</span><div><button class=s data-d="${esc(x.id)}">Download report</button> ${mgr?`<button class=s data-l="${esc(x.id)}">Mark missing as lost</button>`:""}</div></div>`}).join("")||"<p>No finished checks yet.</p>");
 el.innerHTML=h;if($("#skc"))$("#skc").focus();
 el.onsubmit=async e=>{e.preventDefault();
  if(e.target.id==="sks"){const{data,error}=await sb.rpc("start_stock_check",{p_name:$("#skname").value,p_location:$("#skloc").value});if(error)return $("#sksm").textContent="✖ "+error.message;return stock(mgr)}
  if(e.target.id==="skf"){const code=$("#skc").value.trim();if(!code)return;$("#skc").value="";
   const{data,error}=await sb.rpc("scan_copy",{p_check:SKID,p_code:code}),m=$("#skm");m.className=error||/^(CHECK|UNKNOWN)/.test(data)?"no":"ok";m.textContent=error?error.message:data;
   if(!error&&!data.startsWith("Already")){const n=$("#skn");n.textContent=+n.textContent+1}$("#skc").focus()}};
 el.onclick=async e=>{const b=e.target.closest("button");if(!b)return;
  if(b.id==="skx"){if(!confirm("Close this stock check and save the results?"))return;const{data,error}=await sb.rpc("close_stock_check",{p_check:SKID});alert(error?error.message:data);return stock(mgr)}
  if(b.dataset.l){if(!confirm("Mark every missing copy of this check as LOST? This changes the register."))return;const{data,error}=await sb.rpc("mark_missing_lost",{p_check:b.dataset.l});alert(error?error.message:data);return stock(mgr)}
  if(b.dataset.d){const{data:r,error}=await sb.rpc("stock_check_result",{p_check:b.dataset.d});if(error)return alert(error.message);
   const wb=XLSX.utils.book_new(),add=(n,rows)=>XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),n);
   add("Summary",[["Stock check result"],["Expected on shelf",r.expected],["Found",r.found],["Missing",r.missing.length],["Found but not marked available",r.found_not_available.length],["Unknown codes",r.unknown.length]]);
   add("Missing",[["Accession","Title","Location"],...r.missing.map(x=>[x.accession,x.title,x.location])]);
   add("Found but not available",[["Accession","Title","Register status"],...r.found_not_available.map(x=>[x.accession,x.title,x.status])]);
   add("Unknown codes",[["Code"],...r.unknown.map(x=>[x])]);XLSX.writeFile(wb,"DSN_Stock_check.xlsx")}}}

let REG=null;
function regs(){
 const pg=async mk=>{let out=[],f=0;for(let i=0;i<20;i++){const{data,error}=await mk().range(f,f+999);if(error)throw error;out=out.concat(data||[]);if(!data||data.length<1000)break;f+=1000}return out};
 const st=d=>new Date(d+"T00:00:00").toISOString(),en=d=>new Date(new Date(d+"T00:00:00").getTime()+864e5).toISOString(),tm=x=>x?new Date(x).toLocaleString():"";
 const rng=(x,col,a,b)=>{if(a)x=x.gte(col,st(a));if(b)x=x.lt(col,en(b));return x};
 const build={
  acc:async(a,b)=>{const d=await pg(()=>{let x=sb.from("copies").select("accession_number,price,source,acquisition_date,status,location,bib_records(title,author,publisher,publication_year,isbn,call_number)").order("accession_number");if(a)x=x.gte("acquisition_date",a);if(b)x=x.lte("acquisition_date",b);return x});
   return{t:"Accession register",h:["Accession no.","Title","Author","Publisher","Year","ISBN","Call no.","Price (Rs)","Source","Acquired on","Status","Location"],r:d.map(c=>[c.accession_number,c.bib_records?.title,c.bib_records?.author,c.bib_records?.publisher,c.bib_records?.publication_year,c.bib_records?.isbn,c.bib_records?.call_number,c.price,c.source,c.acquisition_date,c.status,c.location])}},
  circ:async(a,b)=>{a=a||new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);b=b||a;
   const sel="members(member_no,full_name),copies(accession_number,bib_records(title))";
   const[I,R,N]=await Promise.all([pg(()=>rng(sb.from("loans").select("issued_at,due_date,"+sel).order("issued_at"),"issued_at",a,b)),pg(()=>rng(sb.from("loans").select("returned_at,due_date,"+sel).not("returned_at","is",null).order("returned_at"),"returned_at",a,b)),pg(()=>rng(sb.from("renewals").select("renewed_at,loans(due_date,"+sel+")").order("renewed_at"),"renewed_at",a,b))]);
   const row=(t,when,l)=>[t,when,l?.members?.member_no,l?.members?.full_name,l?.copies?.accession_number,l?.copies?.bib_records?.title,l?.due_date];
   const all=[...I.map(x=>[x.issued_at,row("Issue",tm(x.issued_at),x)]),...R.map(x=>[x.returned_at,row("Return",tm(x.returned_at),x)]),...N.map(x=>[x.renewed_at,row("Renewal",tm(x.renewed_at),x.loans)])].sort((p,q)=>p[0]<q[0]?-1:1);
   return{t:"Daily circulation register ("+a+(b!==a?" to "+b:"")+")",h:["Type","Date and time","Member no.","Member","Accession no.","Title","Due date"],r:all.map(x=>x[1])}},
  mem:async(a,b)=>{const d=await pg(()=>rng(sb.from("members").select("member_no,full_name,phone,email,status,expiry_date,created_at,member_types(name)").order("member_no"),"created_at",a,b));
   return{t:"Members register",h:["Member no.","Name","Type","Phone","Email","Status","Joined on","Valid until"],r:d.map(m=>[m.member_no,m.full_name,m.member_types?.name,m.phone,m.email,m.status,String(m.created_at).slice(0,10),m.expiry_date])}},
  fin:async(a,b)=>{const d=await pg(()=>rng(sb.from("fines").select("created_at,amount,days_late,status,settled_at,members(member_no,full_name)").order("created_at"),"created_at",a,b));
   return{t:"Fines register",h:["Date","Member no.","Member","Days late","Amount (Rs)","Status","Settled on"],r:d.map(f=>[String(f.created_at).slice(0,10),f.members?.member_no,f.members?.full_name,f.days_late,f.amount,f.status,f.settled_at?String(f.settled_at).slice(0,10):""])}},
  wd:async(a,b)=>{const d=await pg(()=>{let x=sb.from("copy_withdrawals").select("withdrawn_on,kind,reason,copies(accession_number,bib_records(title))").order("withdrawn_on");if(a)x=x.gte("withdrawn_on",a);if(b)x=x.lte("withdrawn_on",b);return x});
   return{t:"Withdrawal register",h:["Date","Accession no.","Title","Kind","Reason"],r:d.map(w=>[w.withdrawn_on,w.copies?.accession_number,w.copies?.bib_records?.title,w.kind,w.reason])}}};
 $("#rgv").onclick=async()=>{const m=$("#rgm");m.textContent="Loading…";try{const a=$("#rgd").value,b=$("#rgt").value,o=await build[$("#rgs").value](a,b);REG=o;
  $("#regp").innerHTML=`<h3>${esc($("#nm").textContent)} - ${esc(o.t)}</h3><p class=tag>${o.r.length} rows</p><div style="overflow-x:auto"><table class=reg><thead><tr>${o.h.map(x=>`<th>${esc(x)}</th>`).join("")}</tr></thead><tbody>${o.r.slice(0,500).map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>${o.r.length>500?`<p class=tag>Showing the first 500 rows. Download Excel for all ${o.r.length}.</p>`:""}`;m.textContent=""}catch(e){m.textContent="Could not load: "+(e.message||e)}};
 $("#rgx").onclick=()=>{if(!REG)return $("#rgm").textContent="Click Show first.";const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([[$("#nm").textContent],[REG.t],["Generated",new Date().toLocaleString()],[],REG.h,...REG.r]),"Register");XLSX.writeFile(wb,"DSN_"+REG.t.replace(/[^A-Za-z0-9]+/g,"_")+".xlsx")};
 $("#rgp").onclick=()=>{if(!REG)return $("#rgm").textContent="Click Show first.";window.print()}}
async function shrink(file,maxKB){const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error("The photo could not be read. Please choose a JPG photo."));i.src=URL.createObjectURL(file)});
 for(const w0 of[300,240,180,140]){const w=Math.min(img.width,w0),h=Math.round(img.height*w/img.width),c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);
  for(const q of[.85,.7,.55,.4]){const b=await new Promise(r=>c.toBlob(r,"image/jpeg",q));if(b&&b.size<=maxKB*1024)return b}}return null}
async function applyFiles(){const id=crypto.randomUUID(),ph=$("#ph").files[0],sg=$("#sg").files[0];
 if(!ph||!sg)throw new Error("Please choose a photo and a signature file.");
 if(!/^image\//.test(ph.type))throw new Error("The photo must be an image (JPG).");
 if(!["image/jpeg","application/pdf"].includes(sg.type)||sg.size>15360)throw new Error("The signature must be a JPG, JPEG or PDF file of at most 15 KB.");
 const pb=await shrink(ph,30);if(!pb)throw new Error("The photo is too large. Please choose a smaller photo.");
 const st=sb.storage.from("member-files"),pp="applications/"+id+"-photo.jpg",sp="applications/"+id+"-sign."+(sg.type==="application/pdf"?"pdf":"jpg");
 let r=await st.upload(pp,pb,{contentType:"image/jpeg"});if(r.error)throw new Error("Photo upload failed. Please try again.");

  else if(k==="od"){const rate=Number(m.member_types?.fine_per_day||0);let tot=0;const lines=g.rows.map(l=>{const late=Math.round((new Date(t+"T00:00:00")-new Date(l.due_date+"T00:00:00"))/864e5),fine=late*rate;tot+=fine;return `- ${tl(l)} (${l.copies?.accession_number}): issued ${dd(l.issued_at.slice(0,10))}, due ${dd(l.due_date)}, ${late} day(s) late x Rs ${rate} = Rs ${fine.toFixed(2)}`});subj="Overdue library book(s)";msg=`Dear ${m.full_name}, the following book(s) are overdue:\n`+lines.join("\n")+`\nFine if returned today: Rs ${tot.toFixed(2)}. The fine grows every day. Please return them soon.\n- ${lib}\nSent: ${now}`}
  else{subj=k==="d0"?"Library book due today":"Library book due in 2 days";msg=`Dear ${m.full_name}, your library book(s) are due ${k==="d0"?"today":"in 2 days"}:\n`+g.rows.map(l=>`- ${tl(l)} (${l.copies?.accession_number}), due ${dd(l.due_date)}`).join("\n")+`\nPlease return them on time to avoid a fine.\n- ${lib}\nSent: ${now}`}
  REMS.push({phone:m.phone,email:m.email,msg,subj});return REMS.length-1};
